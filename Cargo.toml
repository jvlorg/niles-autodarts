[workspace]
resolver = "2"
members = ["crates/autodarts-core", "component"]

[workspace.package]
version = "0.1.0-alpha.2"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Johan Volmers Leth"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
wit-bindgen = "0.63"
tempfile = "3"

[profile.release]
strip = true
lto = true
codegen-units = 1
